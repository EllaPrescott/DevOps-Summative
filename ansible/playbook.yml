- hosts: web
  become: yes
  tasks:

    - name: Install required packages
      dnf:
        name:
          - python3
          - python3-pip
          - git
          - nginx
        state: present


    - name: Ensure application directory exists
      file:
        path: /opt/flaskapp
        state: directory
        mode: '0777'

    - name: Copy Flask app
      copy:
        src: ../app/
        dest: /opt/flaskapp/app
        owner: ec2-user
        group: ec2-user
        mode: '0755'

    - name: Install python dependencies
      command: pip3 install -r /opt/flaskapp/app/requirements.txt



    - name: Configure Nginx reverse proxy for Flask
      copy:
        dest: /etc/nginx/conf.d/flaskapp.conf
        content: |
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Create Flask systemd service
      copy:
        dest: /etc/systemd/system/flask.service
        content: |
          [Unit]
          Description=Flask App
          After=network.target

          [Service]
          User=ec2-user
          WorkingDirectory=/opt/flaskapp/app
          ExecStart=/usr/bin/python3 app.py
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: Enable and start nginx
      systemd:
        name: nginx
        enabled: yes
        state: restarted

    - name: Enable and start Flask
      systemd:
        name: flask
        enabled: yes
        state: restarted


